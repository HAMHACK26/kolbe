name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          g++ pkg-config libx11-dev libasound2-dev libudev-dev
          libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev
      - name: Test Rust code
        run: cargo test --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: height_server/requirements.txt
      - name: Install height server dependencies
        run: python -m pip install -r height_server/requirements.txt
      - name: Test height server
        run: python -m unittest discover -s height_server -p "test_*.py"
