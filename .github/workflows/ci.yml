name: Height server

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: height_server/requirements.txt
      - name: Install height server dependencies
        run: python -m pip install -r height_server/requirements.txt
      - name: Test height server
        run: python -m unittest discover -s height_server -p "test_*.py"
