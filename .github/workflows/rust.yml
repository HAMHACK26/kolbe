name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwayland-dev \
            libasound2-dev \
            libudev-dev \
            pkg-config

      # Fast linker for the large Bevy link step.
      - name: Install mold
        uses: rui314/setup-mold@v1

      # Cache ~/.cargo and target/, keyed on Cargo.lock — the single biggest
      # win: warm runs skip recompiling the ~560-crate Bevy dependency tree
      # from scratch.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # `cargo test` compiles the whole tree already, so the old separate
      # `cargo build` step just built everything twice. One test run covers
      # build + tests.
      - name: Build and test
        run: cargo test --locked --verbose
