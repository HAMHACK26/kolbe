[package]
name = "hackathon_hamburg"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
pyo3 = { version = "0.22", optional = true, features = ["auto-initialize"] }

[features]
# Enable to implement drone logic in Python:
#   cargo run --features python
python = ["dep:pyo3"]

# Thin debuginfo: faster compile + link while keeping backtraces with line
# numbers. Full DWARF debuginfo isn't worth its build/link cost here.
[profile.dev]
debug = "line-tables-only"
